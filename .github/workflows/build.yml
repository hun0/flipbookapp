name: Build APK & EXE

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Use fixed signing key (so updates install over the old app)
        env:
          KEY: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
        run: |
          if [ -n "$KEY" ]; then mkdir -p ~/.android && echo "$KEY" | base64 -d > ~/.android/debug.keystore && echo "fixed key installed"; else echo "no key secret - random key"; fi
      - name: Install
        run: npm install
      - name: Add Android platform
        run: |
          npm run prep
          npx cap add android
          npx cap sync android
      - name: App icon
        run: cp -r icons/android/res/. android/app/src/main/res/
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Rename
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Flipbook.apk
      - uses: actions/upload-artifact@v4
        with: { name: Flipbook-android, path: Flipbook.apk }
      - name: Publish to a release (one per build, so the APK can be grabbed from a phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('빌드 #{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          files: Flipbook.apk

  windows:
    needs: android
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install
        run: npm install
      - name: Build EXE
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with: { name: Flipbook-windows, path: dist/*.exe }
      - name: Add the EXE to the same release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('빌드 #{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          files: dist/*.exe
